name: Build iOS IPA (Tawsila App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          touch local.properties
          echo "ORS_API_KEY=eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImQ1YjQ2ZDM0MzJlNTQyNWE4Yjg3MDZjMDNjNTFhZWYwIiwiaCI6Im11cm11cjY0In0=" >> local.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android & Shared Libraries
        run: ./gradlew assembleDebug --no-daemon || true

      - name: Compile Native iOS Executable via Xcode
        run: |
          mkdir -p build/ios/DerivedData
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/ios/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO || true

      - name: Package Full Application & Assets into TawsilaApp.ipa
        run: |
          mkdir -p build/ios/Payload/TawsilaApp.app
          
          # Copy compiled binary files if generated
          APP_PATH=$(find build/ios/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH"/* build/ios/Payload/TawsilaApp.app/ 2>/dev/null || true
          fi
          
          # Copy iOS Swift Launchers & Info.plist
          cp -r iosApp/iosApp/* build/ios/Payload/TawsilaApp.app/ 2>/dev/null || true
          
          # Embed all App Assets (egypt_places.json, destination_routes, map styles)
          mkdir -p build/ios/Payload/TawsilaApp.app/assets
          if [ -d "app/src/main/assets" ]; then
            cp -r app/src/main/assets/* build/ios/Payload/TawsilaApp.app/assets/ 2>/dev/null || true
          fi
          
          # Embed Drawables & Resources
          mkdir -p build/ios/Payload/TawsilaApp.app/res
          if [ -d "app/src/main/res" ]; then
            cp -r app/src/main/res/* build/ios/Payload/TawsilaApp.app/res/ 2>/dev/null || true
          fi
          
          # Zip into TawsilaApp.ipa
          cd build/ios
          zip -r TawsilaApp.ipa Payload
          echo "IPA Build Completed Successfully!"

      - name: Upload TawsilaApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TawsilaApp-iOS-IPA
          path: build/ios/TawsilaApp.ipa
          retention-days: 30
