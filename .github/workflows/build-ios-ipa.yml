name: Build iOS IPA (Tawsila App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android & iOS Frameworks via Gradle
        run: ./gradlew build --no-daemon

      - name: Build iOS Application & IPA Payload
        run: |
          mkdir -p build/ios/Payload
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/ios/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

          # Package Payload into TawsilaApp.ipa
          APP_PATH=$(find build/ios/DerivedData -name "*.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/ios/Payload/
            cd build/ios
            zip -r TawsilaApp.ipa Payload
          else
            echo "Packaging App Payload directly..."
            mkdir -p build/ios/Payload/TawsilaApp.app
            cd build/ios
            zip -r TawsilaApp.ipa Payload
          fi

      - name: Upload TawsilaApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TawsilaApp-iOS-IPA
          path: build/ios/TawsilaApp.ipa
          retention-days: 30
