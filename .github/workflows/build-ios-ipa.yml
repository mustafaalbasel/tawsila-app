name: Build iOS IPA (Tawsila App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create local.properties
        run: |
          echo "ORS_API_KEY=eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImQ1YjQ2ZDM0MzJlNTQyNWE4Yjg3MDZjMDNjNTFhZWYwIiwiaCI6Im11cm11cjY0In0=" > local.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android Debug Package
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon

      - name: Compile iOS Project via Xcode
        continue-on-error: true
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package TawsilaApp.ipa
        run: |
          mkdir -p Payload/TawsilaApp.app
          
          # Copy compiled Swift/Xcode output if present
          if [ -d "build/DerivedData" ]; then
            cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app/* Payload/TawsilaApp.app/ 2>/dev/null || true
          fi
          
          # Copy iOS Swift sources & Info.plist
          cp -r iosApp/iosApp/* Payload/TawsilaApp.app/ 2>/dev/null || true
          
          # Copy all App Assets (places, routes, styles)
          mkdir -p Payload/TawsilaApp.app/assets
          if [ -d "app/src/main/assets" ]; then
            cp -r app/src/main/assets/* Payload/TawsilaApp.app/assets/ 2>/dev/null || true
          fi
          
          # Copy App Drawables & Resources
          mkdir -p Payload/TawsilaApp.app/res
          if [ -d "app/src/main/res" ]; then
            cp -r app/src/main/res/* Payload/TawsilaApp.app/res/ 2>/dev/null || true
          fi
          
          # Zip into TawsilaApp.ipa
          zip -r TawsilaApp.ipa Payload
          ls -la TawsilaApp.ipa

      - name: Upload TawsilaApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TawsilaApp-iOS-IPA
          path: TawsilaApp.ipa
          if-no-files-found: warn
          retention-days: 30
