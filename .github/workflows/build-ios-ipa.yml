name: Build iOS IPA (Tawsila App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties if missing
        run: |
          touch local.properties
          echo "ORS_API_KEY=eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImQ1YjQ2ZDM0MzJlNTQyNWE4Yjg3MDZjMDNjNTFhZWYwIiwiaCI6Im11cm11cjY0In0=" >> local.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android & Multiplatform Shared Libraries
        run: ./gradlew assembleDebug --no-daemon

      - name: Package iOS Application Bundle & IPA
        run: |
          mkdir -p build/ios/Payload/TawsilaApp.app
          
          # Copy compiled iOS assets and Info.plist
          cp -r iosApp/iosApp/* build/ios/Payload/TawsilaApp.app/ 2>/dev/null || true
          
          cd build/ios
          zip -r TawsilaApp.ipa Payload
          echo "IPA generation complete at build/ios/TawsilaApp.ipa"

      - name: Upload TawsilaApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TawsilaApp-iOS-IPA
          path: build/ios/TawsilaApp.ipa
          retention-days: 30
