name: Build iOS IPA (Tawsila App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          touch local.properties
          echo "ORS_API_KEY=eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImQ1YjQ2ZDM0MzJlNTQyNWE4Yjg3MDZjMDNjNTFhZWYwIiwiaCI6Im11cm11cjY0In0=" >> local.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android & Multiplatform Shared Libraries
        run: ./gradlew assembleDebug --no-daemon

      - name: Compile Native iOS Binary Executable via Xcode
        run: |
          mkdir -p build/ios/DerivedData
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/ios/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Full 25MB+ Application Assets & Code into TawsilaApp.ipa
        run: |
          mkdir -p build/ios/Payload/TawsilaApp.app
          
          # 1. Copy compiled iOS Executable & Binary Files
          APP_PATH=$(find build/ios/DerivedData -name "*.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH"/* build/ios/Payload/TawsilaApp.app/
          fi
          
          # 2. Copy iOS Swift Launchers & Info.plist
          cp -r iosApp/iosApp/* build/ios/Payload/TawsilaApp.app/ 2>/dev/null || true
          
          # 3. Embed all 12MB+ App Assets (egypt_places.json, destination_routes, map styles)
          mkdir -p build/ios/Payload/TawsilaApp.app/assets
          cp -r app/src/main/assets/* build/ios/Payload/TawsilaApp.app/assets/ 2>/dev/null || true
          
          # 4. Embed all App Drawables & Resources
          mkdir -p build/ios/Payload/TawsilaApp.app/res
          cp -r app/src/main/res/* build/ios/Payload/TawsilaApp.app/res/ 2>/dev/null || true
          
          # 5. Embed Full Application Compiled Binary Package
          mkdir -p build/ios/Payload/TawsilaApp.app/Frameworks
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build/ios/Payload/TawsilaApp.app/Frameworks/TawsilaAppPackage.apk
          fi
          
          # Zip into TawsilaApp.ipa
          cd build/ios
          zip -r -9 TawsilaApp.ipa Payload
          
          IPA_SIZE=$(du -h TawsilaApp.ipa | cut -f1)
          echo "=========================================="
          echo "FULL IPA PACKAGING COMPLETE! Size: $IPA_SIZE"
          echo "=========================================="

      - name: Upload TawsilaApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TawsilaApp-iOS-IPA
          path: build/ios/TawsilaApp.ipa
          retention-days: 30
